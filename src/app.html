<!doctype html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<meta name="text-scale" content="scale" />
		<script>
			(() => {
				const storageKey = '%edoctor.preferences.key%';
				const systemQuery = '(prefers-color-scheme: dark)';
				let theme = 'system';

				try {
					const stored = JSON.parse(localStorage.getItem(storageKey) || '{}');
					const preference = stored?.themePreference;

					if (preference === 'light' || preference === 'dark') theme = preference;
				} catch {
					theme = 'system';
				}

				const prefersDark = matchMedia(systemQuery).matches;
				const isDark = theme === 'dark' || (theme === 'system' && prefersDark);

				document.documentElement.classList.toggle('dark', isDark);
				document.documentElement.dataset.theme = theme;
			})();
		</script>
		<script>
			/* D-W51-19 (wave 5.1, screen 64): before the first paint, what this device remembers of the account's doctor
			   standing — a licence of the marketplace marks <html data-doctor-mode> (the bar's «Λειτουργία γιατρού»), and one
			   that left in the doctor's mode opens the doctor's «Σήμερα» from the bare home. Nothing of the person. */
			(() => {
				try {
					const hint = JSON.parse(localStorage.getItem('%edoctor.doctor-mode.key%') || 'null');
					if (!hint || hint.v !== 1 || hint.kind !== 'doctor') return;
					document.documentElement.dataset.doctorMode = 'doctor';
					if (hint.lastMode !== 'DOCTOR' || location.search || location.hash) return;
					const path = location.pathname.replace(/\/+$/, '');
					if (path === '') location.replace('/doctor');
					else if (path === '/en') location.replace('/en/doctor');
				} catch {
					return;
				}
			})();
		</script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

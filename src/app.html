<!doctype html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<meta name="text-scale" content="scale" />
		<script>
			(() => {
				const storageKey = '%edoctor.preferences.key%';
				const systemQuery = '(prefers-color-scheme: dark)';
				let theme = 'system';

				try {
					const stored = JSON.parse(localStorage.getItem(storageKey) || '{}');
					const preference = stored?.themePreference;

					if (preference === 'light' || preference === 'dark') theme = preference;
				} catch {
					theme = 'system';
				}

				const prefersDark = matchMedia(systemQuery).matches;
				const isDark = theme === 'dark' || (theme === 'system' && prefersDark);

				document.documentElement.classList.toggle('dark', isDark);
				document.documentElement.dataset.theme = theme;
			})();
		</script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
